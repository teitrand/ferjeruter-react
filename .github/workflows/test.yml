name: Testar

# Testar for React-skalet og den delte koden (og vanilla-appen, som framleis ligg her).
# Ingen cron, ingen datajobbar og ingen commit: data kjem frå fergeruter.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-testar
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer
        run: npm ci
      - name: Bygg React-skalet
        run: npm run build:web
      - name: JS-testar (core, vanilla, skalmodellen)
        run: node --test --test-concurrency=1 tests/test_status.mjs tests/test_i18n.mjs tests/test_plausible.mjs tests/test_route_mode.mjs tests/test_sw.mjs tests/test_signaltur_cron.mjs tests/test_trafikkmeldinger_worker.mjs
      - name: Render-testar for skalet
        run: npm test -w web
