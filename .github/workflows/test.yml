name: Testar

# Testar for React-skalet og den delte koden (og vanilla-appen, som framleis ligg her).
# Ingen cron, ingen datajobbar og ingen commit: data kjem frå fergeruter.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-testar
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer
        run: npm ci
      - name: Bygg React-skalet
        run: npm run build:web
      # Alle tests/test_*.mjs, så ein ny testfil ikkje kan falle utanfor CI
      # (test_web, test_tripstatus og test_replay_tripstatus stod ikkje på lista før).
      - name: JS-testar (core, vanilla, skalmodellen, service workeren)
        run: node --test --test-concurrency=1 tests/test_*.mjs
      - name: Render-testar for skalet
        run: npm test -w web
