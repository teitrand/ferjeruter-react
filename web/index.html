    plausible.init({

        try {
          var host = location.hostname;
          var path = location.pathname || "";
          if (host === "localhost" || host === "127.0.0.1" || path.indexOf("/dev/") !== -1 || path.indexOf("/ferjeruter-react/") !== -1) {

      customProperties: function () {
        var lang = "nn";

            app = "pwa";

          var savedRoute = localStorage.getItem("fergeruter-route-choice");

        } catch (e) {}
        return { lang: lang, app: app, route: route };
      }
    });
